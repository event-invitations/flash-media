<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Media</title>
   <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap');

      :root{
        --bg:#D1cbcf;
        --border:#1d3154;
      }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #D1cbcf;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Redirect Overlay Animation */
    .redirect-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .redirect-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .redirect-text {
      color: black;
      font-size: 0.95rem;
      letter-spacing: 1px;
      font-weight: 500;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Entrance Animation Wrappers */
    .page-wrapper {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .card {
      background-color: #D1cbcf;
      border-radius: 40px;
      padding: 36px 20px 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.05);
    }

    .logo-container {
      margin-bottom: 16px;
      opacity: 0;
      transform: scale(0.8);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
    }

    .logo-container img {
      max-width: 100px;
      height: auto;
      display: block;
    }

    .brand-name {
      font-family: 'Montserrat', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #1d3154;
      letter-spacing: 1.5px;
      margin-bottom: -2px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.35s forwards;
    }

    .brand-tagline {
      font-size: 1rem;
      color: BLACK;
      font-weight: 500;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.45s forwards;
    }

    .brand-place {
      font-size: 0.8rem;
      color: #b3b3b3;
      font-weight: 500;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.55s forwards;
    }

    .links-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeInUp 0.7s ease 0.65s forwards;
    }

    /* Standard Links */
    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 30px;
      background: #D1cbcf;
      color: black;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      border: 1px solid var(--border);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      text-align: center;
    }

    .link-item:hover {
      background: var(--border);
      color: white;
      font-weight: 500;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }

    .link-item:active {
      transform: scale(0.98);
    }

    .link-item svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .contact-card-box {
      width: 100%;
      background: #D1cbcf;
      border: 1px solid var(--border);
      border-radius: 30px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .contact-card-box.active {
      border-radius: 24px;
      background: var(--border);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
    }

    .contact-header {
      width: 100%;
      padding: 14px 20px;
      background: #D1cbcf;
      border: none;
      color: black;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      display: grid;
      grid-template-columns: 18px 1fr 18px;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: color 0.3s ease, background 0.3s ease;
    }

    .contact-card-box:not(.active) .contact-header:hover {
      background: #D1cbcf;
      color: black;
      font-weight: 500;
    }

    .contact-header svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .contact-title-text {
      text-align: center; /* Centered Text */
    }

    .chevron-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      justify-self: end;
    }

    .contact-card-box.active .chevron-icon {
      transform: rotate(180deg);
    }

    /* Phone Numbers Container */
    .numbers-list {
      max-height: 0;
      background: #D1cbcf;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease, padding 0.4s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 12px;
    }

    .contact-card-box.active .numbers-list {
      max-height: 220px;
      opacity: 1;
      padding: 4px 12px 14px 12px;
    }

    .phone-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #D1cbcf;
      color: black;
      text-decoration: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      border: 1px solid var(--border);
      transition: all 0.25s ease;
    }

    .phone-pill:hover {
      background: var(--border);
      color:white;
      border-color: var(--border);
      transform: scale(1.02);
    }

    .phone-pill svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* Social Bar */
    .social-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.8s forwards;
    }

    .social-bar a {
      color: #d4af37;
      transition: transform 0.25s ease, color 0.25s ease;
      text-decoration: none;
      display: inline-block;
    }

    .social-bar svg {
      width: 24px;
      height: 24px;
    }

    .social-bar a:hover {
      color: #ffffff;
      transform: scale(1.25) translateY(-2px);
    }
    .banner{
      width:115%;
      margin-top:10px;

    }
    /* Keyframes */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes popIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

  <script>
    // Toggle Contact Expandable Box
    function toggleContactBox() {
      const box = document.getElementById('contactCardBox');
      box.classList.toggle('active');
    }

    // Redirecting Animation Trigger
    document.querySelectorAll('.redirect-link').forEach(link => {
      link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        const target = this.getAttribute('target');

        if (href && href !== '#') {
          e.preventDefault();
          const overlay = document.getElementById('redirectOverlay');
          overlay.classList.add('active');

          setTimeout(() => {
            if (target === '_blank') {
              window.open(href, '_blank');
              overlay.classList.remove('active');
            } else {
              window.location.href = href;
              setTimeout(() => overlay.classList.remove('active'), 1000);
            }
          }, 600);
        }
      });
    });
  </script>
